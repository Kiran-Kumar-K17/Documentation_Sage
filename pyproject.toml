[project]
name = "documentation-sage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiran Kumar", email = "kdelta185@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=0.37.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "nltk>=3.10.3",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
documentation-sage = "documentation_sage:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
